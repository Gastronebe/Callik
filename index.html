<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callík – Načítání...</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
        <!-- Fonty: Quicksand (nadpisy) a Poppins (text) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div>
      <div>
        <div class="loader-logo">
            <img src="assets/callik-logo.png" alt="Callík" style="height: 50px; width: auto;">
        </div>
        <div class="spinner"></div>
        <div class="status-text">Ověřuji přihlášení...</div>
    </div>

    <script type="module">
        import { supabase } from './js/supabaseClient.js';

        async function init() {
            try {
                // Získáme aktuální session
                const { data: { session } } = await supabase.auth.getSession();

                // Umělé zpoždění 800ms pro plynulost animace (aby neproblikla)
                setTimeout(() => {
                    if (session) {
                        // Uživatel je přihlášen -> jdi do aplikace
                        window.location.href = 'app.html'; 
                    } else {
                        // Uživatel není přihlášen -> jdi na landing page
                        window.location.href = 'landing.html';
                    }
                }, 800);

            } catch (error) {
                console.error("Chyba při kontrole auth:", error);
                // V případě chyby raději poslat na landing
                window.location.href = 'landing.html';
            }
        }

        init();
    </script>
</body>
</html>
